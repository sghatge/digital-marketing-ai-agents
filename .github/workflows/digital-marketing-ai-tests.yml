name: Digital Marketing AI Lab tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py agents.py
      - name: Run Digital Marketing AI Lab tests
        run: python -m unittest discover -s tests -p "test_agents.py" -v
